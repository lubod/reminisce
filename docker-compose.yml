# Production setup
# Usage: docker compose up -d
# For development, use: docker compose -f docker-compose-dev.yml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: lubod/reminisce-postgres:latest
    logging: *default-logging
    container_name: reminisce-postgres
    mem_limit: 2g
    pids_limit: 200
    networks:
      - backend
    environment:
      POSTGRES_DB: reminisce_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  geotagging-db:
    image: lubod/reminisce-geodb:latest
    logging: *default-logging
    container_name: reminisce-geotagging
    mem_limit: 1g
    pids_limit: 200
    networks:
      - backend
    environment:
      POSTGRES_DB: geotagging_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password is required}
    volumes:
      - geotagging_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-server:
    image: lubod/reminisce-ai-server:latest
    logging: *default-logging
    container_name: reminisce-ai-server
    mem_limit: 12g
    pids_limit: 300
    networks:
      - backend
    expose:
      - "8081"
      - "50051"
    volumes:
      - ai_model_cache:/home/ai_user/.cache/huggingface
      - face_model_cache:/app/.insightface
      - ./ai/ai_service.py:/app/ai_service.py
      - ./ai/ai_service_grpc.py:/app/ai_service_grpc.py
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY:?api_secret_key is required}
      - HF_HOME=/home/ai_user/.cache/huggingface
    # Optional GPU acceleration (AMD ROCm / iGPU):
    # To enable, copy docker-compose.override.yml.example to docker-compose.override.yml,
    # or uncomment the lines below:
    #GPU#devices:
    #GPU#  - /dev/dri:/dev/dri
    #GPU#  - /dev/kfd:/dev/kfd
    #GPU#group_add:
    #GPU#  - "0"
    #GPU#  - "render"
    #GPU#  - "video"
    #GPU#environment:
    #GPU#  - HSA_OVERRIDE_GFX_VERSION=11.0.0
    #GPU#  - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
    #GPU#  - ROCBLAS_USE_HIPBLASLT=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  reminisce:
    image: lubod/reminisce:latest
    logging: *default-logging
    container_name: reminisce
    mem_limit: 4g
    pids_limit: 300
    networks:
      - frontend
      - backend
    expose:
      - "8080"
    ports:
      - "5066:5066/udp" # P2P LAN Discovery (server listens — must match p2p_discovery_port)
      - "5050:5050/udp" # legacy atomic broadcast target kept for older storage nodes
    volumes:
      - ./uploaded_images:/app/uploaded_images
      - ./uploaded_videos:/app/uploaded_videos
      - ./data/p2p:/app/data/p2p # Persistent Node ID and local shards
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - RUST_LOG=info
      - APP_VERSION=0.1.0
      - ENVIRONMENT=production
    command: ["/app/config.yaml"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      geotagging-db:
        condition: service_healthy
      ai-server:
        condition: service_started

  client:
    image: lubod/reminisce-client:latest
    logging: *default-logging
    container_name: reminisce-client
    mem_limit: 512m
    pids_limit: 100
    networks:
      - frontend
    ports:
      - "28080:80"
      - "28443:443"
    volumes:
      - client_ssl:/etc/nginx/ssl
    restart: unless-stopped
    depends_on:
      - reminisce

volumes:
  postgres_data:
  geotagging_data:
  ai_model_cache:
  face_model_cache:
  client_ssl:

networks:
  frontend:
  backend:
    internal: true
